basePath: /
definitions:
  dtorequest.BarCreateRequest:
    properties:
      bar:
        type: string
      code:
        minLength: 3
        type: string
    required:
    - bar
    - code
    type: object
  dtorequest.BarUpdateRequest:
    properties:
      bar:
        type: string
      code:
        type: string
    required:
    - bar
    type: object
  dtorequest.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        minLength: 8
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  dtorequest.ConfirmEmailChangeRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  dtorequest.EmailChangeRequest:
    properties:
      currentPassword:
        type: string
      newEmail:
        type: string
    required:
    - currentPassword
    - newEmail
    type: object
  dtorequest.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dtorequest.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      rememberMe:
        type: boolean
    required:
    - email
    - password
    type: object
  dtorequest.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dtorequest.ResetPasswordRequest:
    properties:
      newPassword:
        minLength: 8
        type: string
      token:
        maxLength: 256
        type: string
    required:
    - newPassword
    - token
    type: object
  dtorequest.SendVerificationEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dtorequest.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  dtoresponse.ActiveSessionResponse:
    properties:
      createdAt:
        type: string
      current:
        description: |-
          Current marks the session the request was made with, so a client can label it "this
          device" and avoid offering to revoke it.
        type: boolean
      deviceName:
        type: string
      deviceType:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      ipAddress:
        type: string
      lastUsedAt:
        type: string
      userAgent:
        type: string
    type: object
  dtoresponse.BarResponse:
    properties:
      bar:
        type: string
      code:
        type: string
      id:
        type: string
    type: object
  dtoresponse.LoginResponse:
    properties:
      menus:
        items:
          $ref: '#/definitions/dtoresponse.MenuResponse'
        type: array
      permissions:
        items:
          type: string
        type: array
      session:
        $ref: '#/definitions/dtoresponse.SessionResponse'
      tokens:
        $ref: '#/definitions/dtoresponse.TokenPairResponse'
      user:
        $ref: '#/definitions/dtoresponse.UserResponse'
    type: object
  dtoresponse.MenuResponse:
    properties:
      child:
        items:
          $ref: '#/definitions/dtoresponse.MenuResponse'
        type: array
      displayOrder:
        type: number
      icon:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      route:
        type: string
      slug:
        type: string
    type: object
  dtoresponse.SessionResponse:
    properties:
      deviceId:
        type: string
      deviceName:
        type: string
      deviceType:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      ipAddress:
        type: string
      isActive:
        type: boolean
      lastUsedAt:
        type: string
      userAgent:
        type: string
    type: object
  dtoresponse.TokenPairResponse:
    properties:
      accessToken:
        type: string
      accessTokenExpiresAt:
        type: string
      accessTokenExpiresIn:
        type: integer
      accessTokenType:
        type: string
      refreshToken:
        description: absent in cookie mode
        type: string
      refreshTokenExpiresAt:
        type: string
      refreshTokenExpiresIn:
        type: integer
      refreshTokenType:
        type: string
    type: object
  dtoresponse.UserResponse:
    properties:
      avatar:
        type: string
      email:
        type: string
      emailVerified:
        type: boolean
      id:
        type: string
      isActive:
        type: boolean
      lastLoginAt:
        type: string
      name:
        type: string
    type: object
  response.BaseResponse:
    properties:
      code:
        description: |-
          Code is set on every error: a stable, machine-readable, snake_case identifier. Clients
          branch on it (and on the status); Message is prose for humans and may change.
        type: string
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.Meta:
    properties:
      hasNext:
        type: boolean
      hasPrev:
        type: boolean
      limit:
        type: integer
      message:
        type: string
      page:
        type: integer
      requestId:
        type: string
      timestamp:
        type: string
      total:
        type: integer
      totalPages:
        type: integer
    type: object
host: localhost:3000
info:
  contact: {}
  description: Go backend boilerplate using Clean Architecture. Provides a ready-to-use
    foundation for REST APIs with auth, RBAC, file uploads, and PostgreSQL.
  title: Goilerplate API
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always answers 200 with the same message, whether or not the address
        is registered. Available only when auth.email.enabled is true.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Request a password reset link
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dtoresponse.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/logout-all:
    post:
      description: Revokes every session of the caller. With keep_current=true the
        session making the request is spared.
      parameters:
      - description: Keep the current session signed in
        in: query
        name: keep_current
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Logout from all devices
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dtoresponse.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: With auth.email.enabled, an address that is already registered
        gets the same 201 as a new one and its owner is emailed instead, so the response
        never says which addresses have accounts. Without email, a taken address is
        409 email_already_registered.
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "409":
          description: email_already_registered, only when auth.email.enabled is false
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Register a new user
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Signs the account out on every device. Available only when auth.email.enabled
        is true.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: validation_failed, a password the policy refuses, or invalid_reset_token
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Reset the password with an emailed token
      tags:
      - auth
  /api/v1/auth/send-verification-email:
    post:
      consumes:
      - application/json
      description: 'Always answers 200 with the same message: for an unknown, disabled
        or already verified address nothing is sent. A code is also sent automatically
        after registration. Available only when auth.email.enabled is true.'
      parameters:
      - description: Address to verify
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.SendVerificationEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Request an email verification code
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Unauthenticated, so it works while auth.require_email_verification
        refuses login. Each code tolerates auth.otp.max_attempts guesses. Available
        only when auth.email.enabled is true.
      parameters:
      - description: Address and 6-digit code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: validation_failed or invalid_verification_code
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      summary: Verify an email address with the emailed code
      tags:
      - auth
  /api/v1/bars:
    get:
      parameters:
      - description: Search keyword
        in: query
        name: keyword
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size, capped at 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dtoresponse.BarResponse'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: List bars
      tags:
      - bars
    post:
      consumes:
      - application/json
      parameters:
      - description: Bar data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.BarCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Path of the created bar
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dtoresponse.BarResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create bar
      tags:
      - bars
  /api/v1/bars/{id}:
    delete:
      parameters:
      - description: Bar ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Delete bar
      tags:
      - bars
    get:
      parameters:
      - description: Bar ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dtoresponse.BarResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get bar by ID
      tags:
      - bars
    put:
      consumes:
      - application/json
      description: 'Replaces the bar''s content. code may be omitted or repeated but
        not changed: it is the business key (400 bar_code_immutable).'
      parameters:
      - description: Bar ID
        in: path
        name: id
        required: true
        type: string
      - description: Bar data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.BarUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dtoresponse.BarResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update bar
      tags:
      - bars
  /api/v1/users/me/email-change:
    post:
      consumes:
      - application/json
      description: Requires the current password. Answers 200 with the same message
        whether or not the address is free; a code is sent only when it is. Available
        only when auth.email.enabled is true.
      parameters:
      - description: New address and current password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.EmailChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: validation_failed or email_unchanged
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: invalid_credentials
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Start changing the account's email address
      tags:
      - auth
  /api/v1/users/me/email-change/confirm:
    post:
      consumes:
      - application/json
      description: The old address is told once the change is made. Available only
        when auth.email.enabled is true.
      parameters:
      - description: 6-digit code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.ConfirmEmailChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: validation_failed or invalid_verification_code
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "409":
          description: 'email_already_registered: the address was taken since the
            code was sent'
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Confirm an email change with the code sent to the new address
      tags:
      - auth
  /api/v1/users/me/password:
    put:
      consumes:
      - application/json
      description: Requires the current password. Revokes every other session; the
        caller stays signed in.
      parameters:
      - description: Password change payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtorequest.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /api/v1/users/me/sessions:
    get:
      description: Active, unexpired sessions of the caller, most recently used first.
        The session making the request has current=true.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dtoresponse.ActiveSessionResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: List my sessions
      tags:
      - auth
  /api/v1/users/me/sessions/{id}:
    delete:
      description: Signs out one device. A session that does not exist, is already
        revoked, or belongs to someone else is 404 — the three are indistinguishable
        on purpose.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Revoke one of my sessions
      tags:
      - auth
securityDefinitions:
  ApiKeyAuth:
    description: Partner API key.
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
