name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - main
  # Without this the test job only ran after a merge, so a pull request was never checked by
  # anything and a red build was found on main rather than on the branch that caused it.
  # Only `test` runs here: `build` and the deploys are gated on github.event_name == 'push'.
  #
  # Deliberately unfiltered by base branch. Filtering on develop/staging/main meant a PR
  # stacked on another PR's branch ran no checks at all, which is exactly when a second
  # opinion is worth most.
  pull_request:
  workflow_dispatch:

# A new push supersedes the one before it; letting both run only burns runners and reports a
# result for a commit nobody is waiting on any more. main is exempt: its runs produce the image
# a deploy uses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default; the build job widens it to what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/goilerplate

jobs:

  # ==============================
  # TEST & LINT
  # ==============================
  test:
    runs-on: ubuntu-latest
    services:
      postgres: # PostgreSQL integration tests (internal/infrastructure/repository)
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis: # Redis integration tests (internal/infrastructure/cache)
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # -race is the point of this step. The service runs background jobs, an in-memory session
      # store with a sweeper and per-session rate limiting, all shared across goroutines, and
      # without the detector a race only ever shows up as an unreproducible production bug.
      # -shuffle=on catches tests that pass only because of the order they run in.
      - name: Run tests
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
        env:
          REDIS_TEST_ADDR: localhost:6379
          POSTGRES_TEST_DSN: host=localhost port=5432 user=postgres password=postgres dbname=goilerplate_test sslmode=disable timezone=UTC

      - name: Coverage summary
        if: always()
        run: |
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | sort -k3 -n | head -15 >> "$GITHUB_STEP_SUMMARY"

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.0

      # Nothing scanned dependencies before this. govulncheck reports only vulnerabilities in
      # code paths actually reachable from this module, so a finding here is one worth acting on.
      #
      # NOT blocking yet, on purpose. The first run found 27 reachable vulnerabilities — 13 in
      # the Go standard library (1.26.2, fixed by 1.26.6) and 14 across grpc, fiber, pgx, x/net,
      # x/text, otel, mapstructure, aws-sdk-go-v2 and ch-go. Failing the build on that would
      # have meant bundling a large dependency upgrade into an unrelated change. Roadmap task H2
      # does the upgrade and flips continue-on-error off; until then this reports on every PR so
      # the number cannot quietly grow.
      - name: Check dependencies for known vulnerabilities
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ==============================
  # BUILD & PUSH TO GHCR
  # Runs on push only — production deploy uses image built from previous push to main
  # ==============================
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

