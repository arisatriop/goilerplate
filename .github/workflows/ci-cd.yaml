name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - main
  # Without this the test job only ran after a merge, so a pull request was never checked by
  # anything and a red build was found on main rather than on the branch that caused it.
  # Only `test` runs here: `build` and the deploys are gated on github.event_name == 'push'.
  #
  # Deliberately unfiltered by base branch. Filtering on develop/staging/main meant a PR
  # stacked on another PR's branch ran no checks at all, which is exactly when a second
  # opinion is worth most.
  pull_request:
  workflow_dispatch:

# A new push supersedes the one before it; letting both run only burns runners and reports a
# result for a commit nobody is waiting on any more. main is exempt: its runs produce the image
# a deploy uses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by default; the build job widens it to what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/goilerplate

jobs:

  # ==============================
  # TEST & LINT
  # ==============================
  test:
    runs-on: ubuntu-latest
    services:
      postgres: # PostgreSQL integration tests (internal/infrastructure/repository)
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis: # Redis integration tests (internal/infrastructure/cache)
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # -race is the point of this step. The service runs background jobs, an in-memory session
      # store with a sweeper and per-session rate limiting, all shared across goroutines, and
      # without the detector a race only ever shows up as an unreproducible production bug.
      # -shuffle=on catches tests that pass only because of the order they run in.
      - name: Run tests
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
        env:
          REDIS_TEST_ADDR: localhost:6379
          POSTGRES_TEST_DSN: host=localhost port=5432 user=postgres password=postgres dbname=goilerplate_test sslmode=disable timezone=UTC

      - name: Coverage summary
        if: always()
        run: |
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | sort -k3 -n | head -15 >> "$GITHUB_STEP_SUMMARY"

      - name: Run linter
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.0

      # Blocking. govulncheck reports only vulnerabilities in code paths actually reachable
      # from this module, so a finding here is one worth acting on rather than triaging.
      #
      # It ran non-blocking for exactly as long as it took to clear the backlog: the first scan
      # found 27 reachable findings, H2 took them to 0, and this flipped in the same change.
      # A scanner that is allowed to stay red teaches everyone to ignore it.
      #
      # If this fails on a PR that did not touch go.mod, a new advisory landed against a
      # dependency you already had — which is the alarm working, not a false one. Upgrade the
      # named module. If an upgrade is genuinely impossible, add the finding to a -show or an
      # explicit exemption with a reason, rather than restoring continue-on-error.
      #
      # govulncheck is pinned rather than @latest: a scanner that silently changes version
      # between runs makes "CI went red and nothing changed" impossible to reason about.
      - name: Check dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  # ==============================
  # IMAGE BUILD CHECK
  # The build job below runs on push only, so until now nothing exercised the Dockerfile on a
  # pull request: a change that broke the image was found on main. This builds it without
  # pushing, so the failure lands on the branch that caused it.
  # ==============================
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================
  # BUILD & PUSH TO GHCR
  # Runs on push only — production deploy uses image built from previous push to main
  # ==============================
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: vars
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Stamped into the binary, so a running container can say which commit it is.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
          # An SBOM lists what is actually inside the image, so when the next advisory lands
          # the question "are we affected" is answered by querying the registry rather than by
          # rebuilding and re-scanning. Provenance signs where the image came from — which
          # workflow, which commit — so a tag cannot be quietly replaced by something else.
          sbom: true
          provenance: mode=max

# The GKE deploy jobs (dev, staging, prod) used to sit here commented out, roughly 165 lines of
# YAML that nothing has ever run. They are recoverable from git history — `git log -S deploy-dev
# -- .github/workflows/ci-cd.yaml` finds them — and a commented-out job is worse than no job:
# it cannot be linted, cannot be tested, and drifts out of date silently while looking like a
# plan. Restore them from history when the deploy is actually switched on.
