# Minimal configuration: PostgreSQL only, every optional component off.
# Copy to config/config.yaml, point `db` at your database, and run.
# For every available option (Redis, gRPC, OTel, S3, ...) see config.full.example.yaml.
#
# Any key can be overridden by an environment variable: dots become underscores,
# e.g. db.password -> DB_PASSWORD, jwt.access_secret -> JWT_ACCESS_SECRET.

app:
  env: dev # dev | production (production enables stricter config validation)
  name: Goilerplate
  version: 1.0.0

server:
  host: 0.0.0.0
  port: 3000
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 120s

db:
  host: localhost
  port: 5432
  name: goilerplate
  sslmode: disable
  username: postgres
  password: postgres
  min_open_connections: 2
  max_open_connections: 20 # must be at least 1
  connection_max_lifetime: 300 # seconds
  connection_max_idle_time: 60 # seconds
  health_check_period: 30 # seconds

# Development-only secrets. Startup validation rejects them when app.env=production;
# generate real ones with: openssl rand -base64 48
jwt:
  key_id: v1
  access_secret: dev-only-changeme-access-secret-000000000
  refresh_secret: dev-only-changeme-refresh-secret-00000000
  access_token_expiry: 15m
  issuer: goilerplate
  audience: goilerplate-api

log:
  level: debug

redis:
  enabled: false

grpc:
  enabled: false
  reflection: false
  auth:
    mode: token          # token | shared_secret | none — see config.full.example.yaml
    public_methods: []

otel:
  enabled: false

rate_limit:
  auth: # per IP: login, register
    max: 10
    expiration: 1m
  user: # per user ID: authenticated routes
    max: 100
    expiration: 1m
  partner: # per API key: partner routes
    max: 1000
    expiration: 1m

filesystem:
  driver: local
  max_file_size: 204800 # bytes (200KB)
  local:
    base_path: ./storage
    base_url: http://localhost:3000/storage

# Partner API keys (name: key). Empty = no partner can authenticate.
# The name is the partner's identity: it is what reaches the context and the logs. The key
# authenticates the request and goes no further.
#
# A value may be the key itself, or its SHA-256 digest written as "sha256:<64 hex chars>" for
# deployments that would rather not keep a usable credential in a config file. The server only
# ever compares digests, so both forms behave identically:
#
#   api_key:
#     acme: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
#
# Generate one with: printf %s "<the key>" | shasum -a 256
api_key: {}

# Guards /internal (pod-to-pod only). none (default) leaves it to the gateway's routing rules;
# shared_secret also requires an X-Internal-Secret header. See config.full.example.yaml.
internal_auth:
  mode: none
  secret: ""

# Deletes revoked/expired sessions and finished one-time tokens older than `retention`.
# See config.full.example.yaml.
jobs:
  cleanup:
    enabled: false
    interval: 1h
    retention: 720h
    batch_size: 1000
