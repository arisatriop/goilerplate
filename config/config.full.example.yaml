# Full configuration reference: every available option with its purpose.
# Start from config.example.yaml (minimal profile) and copy the sections you need from here.
#
# Any key can be overridden by an environment variable: dots become underscores,
# e.g. db.password -> DB_PASSWORD, redis.host -> REDIS_HOST, api_key.partner1 -> API_KEY_PARTNER1.
# Keep real secrets in environment variables or a secret store, not in this file.
#
# Startup validation (config/validate.go) stops the app with a list of every problem:
# missing settings for enabled features, <...> placeholders, JWT secrets shorter than
# 32 bytes, and, when app.env=production, example or low-entropy secrets.

app:
  env: production # dev | production (production enables stricter config validation)
  name: Goilerplate
  version: 1.0.0
  description: Go backend boilerplate

server:
  host: 0.0.0.0
  port: 3000
  prefork: false # Fiber prefork (multiple processes on one port)
  # Connection timeouts. Unset falls back to 15s/15s/60s rather than to "no limit": a
  # server with no read timeout holds a connection for as long as a client keeps dribbling
  # bytes at it.
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 120s
  # Addresses or CIDRs allowed to set the forwarding header. Empty (the default) trusts nobody,
  # so the client IP is always the peer that connected and a spoofed X-Forwarded-For is ignored.
  # List your load balancer or ingress here when one sits in front of the app.
  trusted_proxies:
    - 10.0.0.0/8
  proxy_header: X-Forwarded-For # header consulted, but only from a trusted proxy
  hsts: true # send Strict-Transport-Security; only where TLS terminates in front of the app
  # Caps the request body. Fiber buffers it before a handler runs, so this is the ceiling on
  # what one request can cost in memory. Unset means 10MB; raise it only for routes that
  # genuinely accept large uploads.
  body_limit: 10485760 # 10MB
  # CORS relaxes a browser default that exists for a reason; leave it off for a service with no
  # browser client. Startup validation rejects a configuration Fiber would panic on.
  enable_cors: false
  cors:
    # Comma-separated, each with a scheme. "https://*.example.com" matches subdomains.
    # "*" is allowed outside production, but never together with allow_credentials.
    allow_origin: https://app.example.com
    allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allow_headers: Origin,Content-Type,Accept,Authorization
    # Lets the browser send cookies and Authorization cross-origin. Requires a named origin.
    allow_credentials: false
    # Response headers JavaScript may read; without this a browser sees only the safelisted ones.
    expose_headers: ""
    # How long a browser may cache the preflight result, in seconds.
    max_age: 0

db:
  host: <DB_HOST>
  port: 5432
  name: <DB_NAME>
  sslmode: require # disable | require | verify-ca | verify-full
  username: <DB_USERNAME>
  password: <DB_PASSWORD>
  min_open_connections: 10 # kept open and idle, so a burst does not pay for new handshakes
  max_open_connections: 100 # must be at least 1
  connection_max_lifetime: 300 # seconds
  connection_max_idle_time: 60 # seconds

# Optional. When disabled, rate limiting falls back to in-memory storage.
redis:
  enabled: true
  host: <REDIS_HOST> # host:port, e.g. localhost:6379
  password: <REDIS_PASSWORD>
  db: 0
  dial_timeout: 5s
  read_timeout: 5s
  write_timeout: 5s
  pool_size: 10
  pool_timeout: 6s

# Generate each secret with: openssl rand -base64 48
jwt:
  key_id: v1 # published as the "kid" header of every issued token
  access_secret: <JWT_ACCESS_SECRET> # at least 32 bytes
  refresh_secret: <JWT_REFRESH_SECRET> # at least 32 bytes, different from access_secret
  access_token_expiry: 15m
  issuer: goilerplate # tokens from another issuer are rejected
  audience: goilerplate-api # tokens minted for another audience are rejected
  leeway: 30s # clock skew tolerated when checking exp/nbf/iat
  # Retired keys, accepted for verification only. To rotate: move the current key_id and
  # secrets here, set a new key_id and new secrets above, and drop the entry once every
  # token signed with it has expired (auth.remember_me_expiry after the rotation).
  previous_keys:
    - key_id: v0
      access_secret: <JWT_PREVIOUS_ACCESS_SECRET>
      refresh_secret: <JWT_PREVIOUS_REFRESH_SECRET>

auth:
  revocation: strict # strict = check the session on every request (logout is immediate) | refresh_only = check only on refresh (revocation lands when the access token expires)
  session_cache: auto # auto (redis when enabled, else none) | none | memory | redis; also used for the permission cache
  session_cache_ttl: 30s # memory: max revocation lag across instances; redis: bounds staleness after direct DB edits
  permission_cache_ttl: 15m # safety net; permission changes invalidate the cache explicitly
  session_expiry: 168h # absolute session lifetime, and the refresh token's lifetime; rotation never extends it
  lockout:
    max_attempts: 5 # consecutive failures before the account stops accepting any password
    duration: 10m # how long the lockout lasts
  refresh_reuse_grace: 10s # the just-replaced refresh token stays valid this long, so concurrent tabs and a lost response do not trigger reuse detection
  remember_me_expiry: 720h # absolute session lifetime when the client logs in with remember_me

log:
  level: info # debug | info | warn | error
  source: false # include file:line in every log entry
  redact_fields: [] # extra JSON/query field names to mask (password, token, api_key, ... are always masked)
  omit_body_paths: [/api/v1/auth] # request/response bodies under these path prefixes are never logged

# Optional. Proto contract: github.com/arisatriop/goilerplate-proto
grpc:
  enabled: true
  port: 50051 # must differ from server.port

  # Publishes the whole service surface to anyone who can reach the port, so it stays off
  # unless asked for. Clients import the proto module instead (see docs/guides/grpc.md).
  reflection: false

  # What a call must prove before a handler runs.
  #
  #   token         (default) the same access token HTTP uses, checked against the same
  #                 session store, so handlers get the same user context either way
  #   shared_secret service-to-service calls with no user behind them; callers send the
  #                 secret in the x-internal-secret metadata key
  #   none          nothing is checked — only defensible when the port is reachable
  #                 in-cluster only, and logged as a warning in production
  #
  # public_methods exempts full method names, or a whole service with a trailing /*.
  auth:
    mode: token
    secret: <GRPC_AUTH_SECRET>
    public_methods:
      - /grpc.health.v1.Health/*

  # Terminate TLS on the gRPC port itself, for deployments where it leaves the cluster.
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

# Optional. Traces are exported over OTLP gRPC; Prometheus metrics are served at /metrics.
otel:
  enabled: true
  endpoint: localhost:4317
  insecure: false # true disables TLS (local collectors only)

rate_limit:
  auth: # per IP: login, register
    max: 10
    expiration: 1m
  user: # per user ID: authenticated routes
    max: 100
    expiration: 1m
  partner: # per API key: partner routes
    max: 1000
    expiration: 1m

filesystem:
  driver: s3 # local | s3 | drive
  max_file_size: 204800 # bytes (200KB)

  local:
    base_path: ./storage
    base_url: http://localhost:3000/storage

  # Leave access_key_id / secret_access_key empty to use the default AWS credential chain (e.g. IAM role).
  s3:
    access_key_id: <S3_ACCESS_KEY_ID>
    secret_access_key: <S3_SECRET_ACCESS_KEY>
    region: us-east-1 # required
    bucket: <S3_BUCKET> # required
    endpoint: "" # S3-compatible services, e.g. http://localhost:9000 for MinIO

  # Either credentials_file (service account) or client_id + client_secret + refresh_token (OAuth2).
  drive:
    credentials_file: ./credentials/gdrive-sa-credentials.json
    client_id: ""
    client_secret: ""
    refresh_token: ""
    folder_id: ""

# AES-256-GCM key for pkg/crypto. Nothing in the boilerplate encrypts anything yet — this is
# the seam for when you add a column that needs it. Generate it, do not choose it: the key is
# derived with a single SHA-256, which does not stretch a memorable passphrase.
#   openssl rand -base64 32
crypto:
  encryption_key: <CRYPTO_ENCRYPTION_KEY>

# Partner API keys (name: key), checked by partner routes via the x-api-key header.
api_key:
  partner1: <API_KEY_PARTNER1>

# Guards the /internal routes, which are meant for pod-to-pod traffic only.
#
# Keeping them off the public internet is the gateway's job: forward an explicit allowlist
# (/api, /partner, /health) and never a catch-all "/". This is a second lock for when that
# config belongs to another team, or changes often enough that one day it will be wrong.
#
#   none          (default) no check; the gateway is the only thing standing in front
#   shared_secret callers must send X-Internal-Secret, compared in constant time
#
# The secret is shared by every caller and travels on every request, so it identifies
# "something in the cluster", not which service. X-Service-Name is recorded for attribution
# in logs and is an unverified claim — never use it for authorization.
internal_auth:
  mode: none
  secret: <INTERNAL_AUTH_SECRET>

# Background jobs the application runs for itself.
#
# cleanup deletes rows that can no longer be used: revoked or expired user_sessions, and
# one_time_tokens that were consumed or expired. Both are kept for `retention` past that
# moment — a revoked session is the record of a logout, and an incident is usually
# investigated well after it happened. They are removed because the tables would otherwise
# grow without bound, not because the history stops being useful.
#
# Off by default: deleting rows is not something a boilerplate should start doing to a
# deployment that never asked for it.
#
# With Redis, the job takes a lock so only one instance runs a pass. Without Redis the lock
# is per process, which is correct for a single instance. The deletes are idempotent either
# way, so an overlap wastes work rather than breaking anything.
#
# retention must be at least auth.session_expiry, or a session could be deleted while it is
# still valid. Startup refuses a configuration where it is not.
jobs:
  cleanup:
    enabled: false
    interval: 1h
    retention: 720h      # 30 days
    batch_size: 1000     # rows per DELETE; the pass repeats until nothing eligible is left

# External HTTP services (name: settings), available as config.Services.
service:
  payment_gateway:
    name: PAYMENT_GATEWAY
    base_url: https://api.payment-gateway.example
    api_key: <SERVICE_PAYMENT_GATEWAY_API_KEY>
